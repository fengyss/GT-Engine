name: Generate LOC Badge
on:
  push:
    branches: [main, master] # 推送到主分支时触发
  workflow_dispatch: # 允许在 GitHub 网页端手动触发

# 关键：显式赋予 Action 向仓库写入文件的权限
permissions:
  contents: write

jobs:
  loc_job:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 关键：如果 10 分钟内没跑完直接终止，防止卡死
    name: Count lines of code and generate badge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count lines and generate badge
        id: counting
        uses: MikhailEpatko/loc-badge-action@v4.0.0
        with:
          output-filename: loc-badge.svg
          color: blue
          # 关键：只统计你关心的代码文件，避免统计图片、视频等二进制文件导致脚本卡死
          patterns: |
            *.cpp
            *.h
          # 关键：排除不需要的目录
          exclude-directories: |
            vendor
            docs
            .github
            .git

      - name: Commit and push badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: loc-badge.svg
          commit_message: "chore: update loc badge [skip ci]"
          skip_fetch: true # 加速推送过程
