name: Generate LOC Badge
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loc_job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count lines and generate badge
        id: counting
        uses: MikhailEpatko/loc-badge-action@v4.0.0
        with:
          output-filename: loc-badge.svg
          color: blue
          # 关键修正：使用 scan-directories 而不是 patterns
          # 默认是扫描根目录，通常不需要改
          scan-directories: "." 
          exclude-directories: |
            node_modules
            dist
            build
            .git
            .github

      - name: Commit and push badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: loc-badge.svg
          commit_message: "chore: update loc badge [skip ci]"
